bank {
  # Loopback unless something outside this machine has to reach it; the pod sets HOST=0.0.0.0.
  host = "127.0.0.1"
  host = ${?HOST}
  port = 8080
  port = ${?PORT}

  # Joined by lark-app-cluster (lark spec 0096), which reads this section as it stands.
  cluster {
    # This node on the cluster's own transport. On Kubernetes the name is the pod's and the host its IP, which is
    # also the address peers reach it at, so it must be the exact string the pods API reports.
    node {
      name = "bank-1"
      name = ${?POD_NAME}
      host = "127.0.0.1"
      host = ${?POD_IP}
      port = 25520
      port = ${?REMOTING_PORT}
    }
    # static: the seeds below. kubernetes: every running pod matching the selector in the pod's own namespace, and a
    # Lease for an even split.
    join = "static"
    join = ${?CLUSTER_JOIN}
    static.seeds = ["127.0.0.1:25520"]
    kubernetes {
      selector { app = "lark-bank" }
      lease = "lark-bank-split-brain"
    }
    downing.stableAfter = 20s
    # SWIM: how often a member is probed, and how long its ack may take before others are asked to probe it.
    # A JVM warming up or pausing for GC answers late, and a late ack is how a healthy node gets downed.
    gossip { probeEvery = 1s, ackWithin = 600ms, formAfter = 5s }
    # A node the others downed ends its process, so Kubernetes or Docker starts a new one that joins afresh.
    whenDowned = exit
  }

  entities {
    shards = 256
    passivateAfter = 2m
    snapshotEvery = 100
    askTimeout = 3s
    # How long a transfer is waited on before it is answered as still pending.
    transferWait = 1s
    legTimeout = 2s
    # The most commands a busy account decides before one append writes them all.
    batch = 64
  }

  readModels {
    # Each journal database's read models are split this many ways by slice (spec 0014), and the partitions spread
    # over the nodes. Changing it starts every read model again from the lowest offset it overlaps: they are
    # idempotent, so that costs time, not correctness.
    partitions = 4
    partitions = ${?READ_MODEL_PARTITIONS}
    batch = 500
    within = 200ms
    sweepEvery = 5s
    stuckAfter = 5s
  }

  database {
    url = "jdbc:postgresql://127.0.0.1:55432/bank"
    url = ${?DATABASE_URL}
    user = "bank"
    user = ${?DATABASE_USER}
    password = "bank"
    password = ${?DATABASE_PASSWORD}
    poolSize = 32
    poolSize = ${?DATABASE_POOL_SIZE}
  }

  # The journal split across databases by id (lark spec 0088). bank.database is the first, named primary; others
  # are "name=url" pairs, comma-separated, sharing its user, password and pool size. Which database owns which slices
  # is kept in the primary (lark spec 0105), written on first start from the databases listed then. A database added
  # later owns nothing until lark-journal-move moves a range of slices to it; one listed must never be removed while
  # it owns any.
  journal {
    primary = "db-0"
    databases = ""
    databases = ${?JOURNAL_DATABASES}
    # Each database's appends share commits (lark spec 0108).
    groupCommit = true
    groupCommit = ${?JOURNAL_GROUP_COMMIT}
  }

  # The currencies the bank keeps (bank spec 0011): each one's places, and how it is shown. The places are the ledger's
  # and never change once an account holds the currency: ETH is held to the gwei, 9 places.
  currencies {
    GBP { exponent = 2, symbol = "£" }
    EUR { exponent = 2, symbol = "€" }
    USD { exponent = 2, symbol = "$" }
    JPY { exponent = 0, symbol = "¥" }
    BTC { exponent = 8, symbol = "₿", kind = crypto }
    ETH { exponent = 9, symbol = "Ξ", kind = crypto }
  }

  # Every event published to Kafka, the schemas in Apicurio (bank spec 0015). Off, nothing is published.
  kafka {
    enabled = false
    enabled = ${?KAFKA_ENABLED}
    bootstrap = "127.0.0.1:9092"
    bootstrap = ${?KAFKA_BOOTSTRAP}
    registry = "http://127.0.0.1:8081/apis/registry/v3"
    registry = ${?APICURIO_URL}
    # Copies of each partition: 3 on a cluster of brokers, 1 on the one broker at home.
    replication = 1
    replication = ${?KAFKA_REPLICATION}
    # The bank's user on the brokers (bank spec 0021): empty connects as nobody, which a broker with users refuses.
    username = ""
    username = ${?KAFKA_USERNAME}
    password = ""
    password = ${?KAFKA_PASSWORD}
  }

  # Each transfer asked about before it debits (bank spec 0018). Off, transfers debit at once, as before.
  screening {
    enabled = false
    enabled = ${?SCREENING_ENABLED}
    url = "http://127.0.0.1:8090"
    url = ${?SCREENING_URL}
    # How long a transfer waits for the check before the bank decides for it, as whenUnanswered says.
    timeout = 300ms
    timeout = ${?SCREENING_TIMEOUT}
    # approve: an outage of the check never stops the bank; decline: nothing moves unchecked.
    whenUnanswered = approve
    whenUnanswered = ${?SCREENING_WHEN_UNANSWERED}
  }
}

# Support's grants, approved in Approvals and heard on Kafka (bank spec 0021). Off, support sees only their own.
bank.access {
  enabled = false
  enabled = ${?ACCESS_ENABLED}
  approvalsUrl = "http://127.0.0.1:8070"
  approvalsUrl = ${?APPROVALS_URL}
  # The bank's own token for Approvals: Pocket ID's client credentials at home, the test issuer's grant elsewhere.
  tokenUrl = "http://127.0.0.1:9000/token"
  tokenUrl = ${?APPROVALS_TOKEN_URL}
  tokenForm = "grant_type=client_credentials&client_id=bank-service"
  tokenForm = ${?APPROVALS_TOKEN_FORM}
  clientSecret = ""
  clientSecret = ${?APPROVALS_CLIENT_SECRET}
}

# bank-access asked every question the bank's rules answer, and compared (bank spec 0022). Off, nothing is asked.
# Spans to Tempo (bank spec 0024), one request in ten unless told otherwise.
bank.telemetry {
  enabled = false
  enabled = ${?TELEMETRY_ENABLED}
  otlp = "http://127.0.0.1:4318"
  otlp = ${?OTEL_EXPORTER_OTLP_ENDPOINT}
  sampled = 0.1
  sampled = ${?TELEMETRY_SAMPLED}
}

# bank-access (bank spec 0022): every question the bank's rules answer asked here too, in shadow, and the auditor's
# questions on the access page answered from it. Off, the access page answers 503.
bank.accessShadow {
  enabled = false
  enabled = ${?ACCESS_SHADOW_ENABLED}
  url = "http://127.0.0.1:8080"
  url = ${?FGA_API_URL}
  token = ""
  token = ${?FGA_API_TOKEN}
  store = "bank"
  store = ${?FGA_STORE}
  # A relationship trails the event it comes from: a disagreement is asked again this much later before it counts.
  recheckAfter = 2s
}

bank.identity {
  # Where tokens come from, and whom they must be for (bank spec 0021). Pocket ID at home; the test issuer elsewhere.
  issuer = "http://127.0.0.1:9000"
  issuer = ${?IDENTITY_ISSUER}
  audience = "lark-bank"
  audience = ${?IDENTITY_AUDIENCE}
  # The pages sign people in as this client, and are sent back here.
  clientId = "bank-pages"
  clientId = ${?IDENTITY_CLIENT_ID}
  clientSecret = ""
  clientSecret = ${?IDENTITY_CLIENT_SECRET}
  callbackUrl = "http://127.0.0.1:8080/callback"
  callbackUrl = ${?IDENTITY_CALLBACK_URL}
  # Base64 of 32 bytes, the same on every node. Empty makes one at start: sessions then open on that node only.
  sessionKey = ""
  sessionKey = ${?IDENTITY_SESSION_KEY}
}

# The HTTP client's pool, which screening's calls go through (bank spec 0018). Pekko's defaults, 4 connections and 32
# requests queued, refuse most of a few hundred transfers a second at once, and each refusal is a transfer unscreened.
pekko.http.host-connection-pool {
  max-connections = 64
  # A power of two.
  max-open-requests = 1024
}
