# Loki (bank spec 0023): every service's lines, one pod running every part of Loki, its index and chunks in Garage's
# `logs` bucket, on network storage with the backups and the traces, kept 30 days. Fluent Bit sends to it; Grafana reads it.
apiVersion: v1
kind: Secret
metadata: { name: logs-store }
type: Opaque
# Development values; SOPS supplies the real ones at home (spec 0017). Garage's key ids are GK and 24 hex digits.
stringData: { LOGS_KEY_ID: GKfedcba9876543210fedcba98, LOGS_SECRET_KEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210 }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: loki }
data:
  loki.yaml: |
    auth_enabled: false
    server: { http_listen_port: 3100, grpc_listen_port: 9095, log_format: json }
    common:
      path_prefix: /var/loki
      replication_factor: 1
      ring: { kvstore: { store: inmemory } }
      storage:
        s3:
          endpoint: garage:3900
          bucketnames: logs
          region: us-east-1
          insecure: true
          s3forcepathstyle: true
          access_key_id: ${LOGS_KEY_ID}
          secret_access_key: ${LOGS_SECRET_KEY}
    schema_config:
      configs:
        - { from: "2026-10-01", store: tsdb, object_store: s3, schema: v13, index: { prefix: index_, period: 24h } }
    # What has not reached Garage is in the write-ahead log on the pod's own volume, replayed when it comes back; on a
    # graceful stop the ingester flushes everything first.
    ingester:
      wal: { enabled: true, dir: /var/loki/wal, flush_on_shutdown: true }
      chunk_idle_period: 5m
      max_chunk_age: 1h
    # Thirty days, then the compactor deletes them from Garage.
    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true
      delete_request_store: s3
    limits_config:
      retention_period: 720h
      # trace_id rides as structured metadata, so finding one trace reads only its lines' metadata.
      allow_structured_metadata: true
      volume_enabled: true
    analytics: { reporting_enabled: false }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: loki }
spec:
  serviceName: loki
  replicas: 1
  selector: { matchLabels: { app: loki } }
  template:
    metadata:
      labels: { app: loki }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "3100", prometheus.io/path: /metrics }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      # Long enough to flush what the write-ahead log holds to Garage before it goes.
      terminationGracePeriodSeconds: 60
      containers:
        - name: loki
          image: grafana/loki:3.5.0
          args: [ -config.file=/etc/loki/loki.yaml, -config.expand-env=true, -target=all ]
          envFrom: [ { secretRef: { name: logs-store } } ]
          ports:
            - { containerPort: 3100, name: http }
          readinessProbe: { httpGet: { path: /ready, port: http }, periodSeconds: 10 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ ALL ] } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data, mountPath: /var/loki }
      volumes:
        - { name: config, configMap: { name: loki } }
  # The write-ahead log, the index not yet shipped, and the compactor's work: a small volume, so a pod deleted without
  # time to flush loses no lines.
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ ReadWriteOnce ], resources: { requests: { storage: 2Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: loki }
spec:
  selector: { app: loki }
  ports: [ { name: http, port: 3100, targetPort: http } ]
