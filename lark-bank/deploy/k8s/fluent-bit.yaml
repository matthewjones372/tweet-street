# Fluent Bit (bank spec 0023): on every machine, the bank's namespaces' container logs to Loki (lark-bank, the restore
# drill's and Flux's, so every alert's lines are there), with four labels
# only (namespace, app, pod, level) and trace_id as structured metadata; everything else stays in the line, read by
# `| json` at query time. Where it has read to is kept on the machine, so a restart neither resends nor skips.
apiVersion: v1
kind: ServiceAccount
metadata: { name: fluent-bit }
---
# The pods' labels, for `app`, in each namespace read: without them a line loses its namespace and pod too. Reading
# pods and nothing else, as Estate's reader does.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: fluent-bit }
rules:
  - { apiGroups: [ "" ], resources: [ pods ], verbs: [ get, list, watch ] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: fluent-bit }
subjects: [ { kind: ServiceAccount, name: fluent-bit } ]
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: fluent-bit }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: fluent-bit }
data:
  fluent-bit.yaml: |
    service:
      flush: 1
      log_level: warn
      http_server: on
      http_port: 2020
      health_check: on
    pipeline:
      inputs:
        - name: tail
          path: /var/log/containers/*_lark-bank_*.log,/var/log/containers/*_restore-drill_*.log,/var/log/containers/*_flux-system_*.log
          tag: kube.*
          # containerd's lines, a long one rejoined from its parts.
          multiline.parser: cri
          db: /var/lib/fluent-bit/tail.db
          # A file found at start read from its beginning, not its end: what a pod wrote before this one ran is shipped
          # too. The offsets above keep a restart from sending it twice.
          read_from_head: true
          # What waits for Loki is held to this, and the tail pauses rather than grow past it.
          mem_buf_limit: 8MB
          skip_long_lines: on
          refresh_interval: 5
      filters:
        - name: kubernetes
          match: kube.*
          # A service's JSON line becomes the record's own fields, so `level` and `trace_id` can be read.
          merge_log: on
          keep_log: off
          labels: on
          annotations: off
      outputs:
        - name: loki
          match: kube.*
          host: loki
          port: 3100
          labels: namespace=$kubernetes['namespace_name'], app=$kubernetes['labels']['app'], pod=$kubernetes['pod_name'], level=$level
          structured_metadata: trace_id=$trace_id
          remove_keys: kubernetes, stream, _p, time
          line_format: json
          retry_limit: no_limits
---
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: fluent-bit }
spec:
  selector: { matchLabels: { app: fluent-bit } }
  template:
    metadata:
      labels: { app: fluent-bit }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "2020", prometheus.io/path: /api/v2/metrics/prometheus }
    spec:
      serviceAccountName: fluent-bit
      tolerations: [ { operator: Exists } ]
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:4.0.3
          args: [ -c, /etc/fluent-bit/fluent-bit.yaml ]
          ports: [ { containerPort: 2020, name: http } ]
          readinessProbe: { httpGet: { path: /api/v1/health, port: http }, periodSeconds: 10 }
          # Root to read the node's logs, and nothing else: no privilege, no capabilities, a read-only image.
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ ALL ], add: [ DAC_READ_SEARCH ] } }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/fluent-bit }
            - { name: logs, mountPath: /var/log, readOnly: true }
            - { name: offsets, mountPath: /var/lib/fluent-bit }
      volumes:
        - { name: config, configMap: { name: fluent-bit } }
        - { name: logs, hostPath: { path: /var/log } }
        - { name: offsets, hostPath: { path: /var/lib/fluent-bit, type: DirectoryOrCreate } }
