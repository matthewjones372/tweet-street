# The pages and metrics as before; the runners' port only from Estate's own pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: estate
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: estate }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: http }
        - { port: metrics }
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: estate }
      ports:
        - { port: cluster }
