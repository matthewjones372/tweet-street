# Fluent Bit for compose (bank spec 0023): every container's lines from Docker's own files, to Loki. A service's JSON
# line names it (`service`, `node`), so those become the `app` and `pod` labels the cluster's have; lines that are not
# the services' JSON (Kafka's, Postgres') go with `level` and `app` unset.
service:
  flush: 1
  log_level: warn
  http_server: on
  http_port: 2020
  # The image's own parsers, for `docker`: Docker's files.
  parsers_file: /fluent-bit/etc/parsers.conf
# A line as JSON and nothing more: the image's `json` reads a `time` field as a web server's, which ours are not.
parsers:
  - name: line
    format: json
pipeline:
  inputs:
    - name: tail
      path: /var/lib/docker/containers/*/*-json.log
      tag: docker.*
      parser: docker
      db: /var/lib/fluent-bit/tail.db
      # A file found at start read from its beginning, not its end: what a pod wrote before this one ran is shipped
      # too. The offsets above keep a restart from sending it twice.
      read_from_head: true
      mem_buf_limit: 8MB
      skip_long_lines: on
      refresh_interval: 5
  filters:
    # Docker's `log` field is the service's line: its JSON becomes the record's own fields.
    - name: parser
      match: docker.*
      key_name: log
      parser: line
      reserve_data: on
  outputs:
    - name: loki
      match: docker.*
      host: loki
      port: 3100
      labels: namespace=compose, app=$service, pod=$node, level=$level
      structured_metadata: trace_id=$trace_id
      remove_keys: stream, time
      line_format: json
      retry_limit: no_limits
