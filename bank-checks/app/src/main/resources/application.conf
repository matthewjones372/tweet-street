checks {
  port = 8090
  port = ${?PORT}

  database {
    url = "jdbc:postgresql://127.0.0.1:5432/checks"
    url = ${?DATABASE_URL}
    user = "checks"
    user = ${?DATABASE_USER}
    password = "checks"
    password = ${?DATABASE_PASSWORD}
    poolSize = 16
    poolSize = ${?DATABASE_POOL_SIZE}
  }

  # The live rules are reloaded when a version is stored (NOTIFY), and on this poll as a backstop.
  policy.pollEvery = 30s

  # Monitoring reads bank.account-events and publishes checks.flags. Off, only screening and the wizard run.
  kafka {
    enabled = false
    enabled = ${?KAFKA_ENABLED}
    bootstrap = "127.0.0.1:9092"
    bootstrap = ${?KAFKA_BOOTSTRAP}
    registry = "http://127.0.0.1:8081/apis/registry/v3"
    registry = ${?APICURIO_URL}
    replication = 1
    replication = ${?KAFKA_REPLICATION}
    group = "checks-monitoring"
    # The checks' user on the brokers (lark-bank spec 0021): empty connects as nobody, which a broker with users refuses.
    username = ""
    username = ${?KAFKA_USERNAME}
    password = ""
    password = ${?KAFKA_PASSWORD}
  }

  # Spans to Tempo (lark-bank spec 0024): the bank's screening call continues its transfer's trace here.
  telemetry {
    enabled = false
    enabled = ${?TELEMETRY_ENABLED}
    otlp = "http://127.0.0.1:4318"
    otlp = ${?OTEL_EXPORTER_OTLP_ENDPOINT}
    sampled = 0.1
    sampled = ${?TELEMETRY_SAMPLED}
  }

  # Admins sign in through the identity provider, Pocket ID at home (lark-bank spec 0019): whoever it puts in one of
  # these groups, separated by commas, may change the policy.
  admins = "risk, admins"
  admins = ${?CHECKS_ADMIN_GROUPS}
  sessionFor = 12h
  signInWithin = 10m

  # Where the wizard is, for the link on each request it asks for.
  publicUrl = ""
  publicUrl = ${?PUBLIC_URL}

  # A version that would change what is in force waits until Approvals gives it (lark-bank spec 0019): asked over HTTP
  # with a service token, answered on Kafka (bank.approval-events), so Kafka must be on too.
  approvals {
    enabled = false
    enabled = ${?APPROVALS_ENABLED}
    url = "http://127.0.0.1:8070"
    url = ${?APPROVALS_URL}
    # Approvals' own pages, for the wizard's links.
    pages = ""
    pages = ${?APPROVALS_PAGES}
    # The identity provider's token endpoint, and the form that gets a token in the `services` group.
    tokenUrl = "http://127.0.0.1:9000/token"
    tokenUrl = ${?APPROVALS_TOKEN_URL}
    tokenForm = "grant_type=client_credentials&client_id=checks-service"
    tokenForm = ${?APPROVALS_TOKEN_FORM}
    # The client's secret, added to the form: at home pocket-id-setup makes it and keeps it in a Secret.
    clientSecret = ""
    clientSecret = ${?APPROVALS_CLIENT_SECRET}
  }

  # The wizard's client at the provider: public with PKCE when there is no secret.
  identity {
    issuer = "http://127.0.0.1:9000"
    issuer = ${?IDENTITY_ISSUER}
    clientId = "checks-pages"
    clientId = ${?IDENTITY_CLIENT_ID}
    clientSecret = ""
    clientSecret = ${?IDENTITY_CLIENT_SECRET}
    callbackUrl = "http://127.0.0.1:8090/callback"
    callbackUrl = ${?IDENTITY_CALLBACK_URL}
  }
}
