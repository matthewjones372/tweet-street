stryker4s {
  # Mutation testing for the money zone: the policy and screening domains. Run on demand (`sbt policy/stryker screening/stryker`).
  mutate = [
    "src/main/scala/checks/policy/domain/**.scala",
    "src/main/scala/checks/screening/domain/**.scala"
  ]
  reporters = ["console", "html", "json"]
}
