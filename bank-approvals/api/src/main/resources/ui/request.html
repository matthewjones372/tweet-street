<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request</title>
  <link rel="stylesheet" href="approvals.css">
</head>
<body>
<header>
  <strong>Approvals</strong>
  <nav>
    <a href="./">Requests</a>
    <a href="/api-docs">API</a>
  </nav>
</header>
<main>
  <section>
    <p class="muted" id="subject"></p>
    <h1 id="title"></h1>
    <p><span id="state"></span> <span class="muted" id="standing"></span></p>
    <p id="problem" class="message" hidden></p>
  </section>

  <section>
    <h2>The change</h2>
    <div class="diff">
      <div><h3>Now</h3><pre id="before"></pre></div>
      <div><h3>After</h3><pre id="after"></pre></div>
    </div>
  </section>

  <section>
    <h2>About it</h2>
    <dl class="facts" id="about"></dl>
  </section>

  <section>
    <h2>Thread</h2>
    <ol class="timeline" id="timeline"></ol>
  </section>

  <section id="acting" hidden>
    <h2>Your part</h2>
    <div class="actions">
      <form id="comment-form">
        <label style="flex: 1">Comment <textarea name="text" id="comment-text" required></textarea></label>
        <button id="comment">Comment</button>
      </form>
      <form id="vote-form" hidden>
        <label style="flex: 1">A word with your vote (needed to reject) <textarea name="text" id="vote-text"></textarea></label>
        <button id="approve">Approve</button>
        <button id="reject" class="quiet" type="button">Reject</button>
      </form>
      <form id="withdraw-form" hidden>
        <button id="withdraw" class="quiet">Withdraw this request</button>
      </form>
    </div>
    <p id="acted" class="message" hidden></p>
  </section>
</main>
<script type="module">
  import { $, approve, comment, diff, refusal, reject, request, show, signedIn, stateLabel, when, withdraw } from "./approvals.js";

  const id = new URLSearchParams(location.search).get("id") ?? "";
  const who = await signedIn();

  const WHAT = {
    requested: "asked for this",
    "approved-automatically": "Approved automatically: the policy needs nobody for",
    "awaiting-approval": "Waiting for",
    approved: "approved",
    "approval-given": "Approval given by",
    rejected: "rejected",
    commented: "",
    "vote-refused": "voted, and it was not counted:",
    withdrawn: "withdrew it",
    superseded: "Superseded by a newer request",
    expired: "Expired with no decision",
    applied: "Applied by its owner",
    "apply-failed": "Its owner could not apply it:",
  };

  function render(view) {
    document.title = view.title;
    $("#subject").textContent = `${view.kind} · ${view.subject}`;
    $("#title").textContent = view.title;
    $("#state").replaceChildren(stateLabel(view.state));
    $("#standing").textContent = `${view.approvedBy.length} of ${view.needed} approvals from ${view.approvers.join(" or ")}`;

    $("#before").replaceChildren();
    $("#after").replaceChildren();
    diff(view.before, view.after, $("#before"), $("#after"));

    const about = $("#about");
    about.replaceChildren();
    const fact = (term, value) => {
      if (value === null || value === undefined || value === "") return;
      const dt = document.createElement("dt");
      dt.textContent = term;
      const dd = document.createElement("dd");
      if (value instanceof Node) dd.append(value); else dd.textContent = value;
      about.append(dt, dd);
    };
    fact("Asked by", view.requester.name);
    fact("Impact", view.impact);
    if (view.link) {
      const link = document.createElement("a");
      link.href = view.link;
      link.textContent = view.link;
      link.rel = "noopener";
      fact("Link", link);
    }
    for (const [key, value] of Object.entries(view.facts)) fact(key, value);
    fact("Approved by", view.approvedBy.map((p) => p.name).join(", ") || "nobody yet");
    fact("Policy", view.policyVersion);
    fact("Expires", view.state === "awaiting-approval" ? when(view.expiresAt) : null);
    const hash = document.createElement("code");
    hash.textContent = view.hash;
    fact("Content hash", hash);

    const timeline = $("#timeline");
    timeline.replaceChildren();
    for (const entry of view.timeline) {
      const item = document.createElement("li");
      item.dataset.what = entry.what;
      const head = document.createElement("div");
      head.className = "head";
      const actor = document.createElement("strong");
      actor.textContent = entry.who?.name ?? "";
      const what = document.createElement("span");
      what.textContent = WHAT[entry.what] ?? entry.what;
      const time = document.createElement("time");
      time.dateTime = entry.at;
      time.textContent = when(entry.at);
      head.append(actor, what, time);
      item.append(head);
      if (entry.text && entry.what !== "requested") {
        const text = document.createElement("p");
        text.className = "text";
        text.textContent = entry.text;
        item.append(text);
      }
      timeline.append(item);
    }

    // Only what this person may do now: the domain refuses the rest, and says why.
    const mine = who && view.requester.subject === who.subject;
    const approver = who && view.approvers.some((group) => who.groups.includes(group));
    const waiting = view.state === "awaiting-approval";
    const open = waiting || view.state === "approved";
    $("#acting").hidden = !(open && (mine || approver));
    const voted = who && view.approvedBy.some((person) => person.subject === who.subject);
    $("#vote-form").hidden = !(waiting && approver && !mine && !voted);
    $("#withdraw-form").hidden = !(waiting && mine);
  }

  async function load() {
    const result = await request(id);
    if (!result.ok) return show($("#problem"), refusal(result), "bad");
    render(result.body);
    return result.body;
  }

  let view = await load();

  async function acted(result, done) {
    if (result.ok) {
      view = result.body;
      render(view);
      done?.();
      show($("#acted"), "Done", "good");
    } else {
      show($("#acted"), refusal(result), "bad");
    }
  }

  $("#comment-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    await acted(await comment(id, $("#comment-text").value), () => { $("#comment-text").value = ""; });
  });
  $("#vote-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    // The vote is on the content shown: if it changed under the page, the vote is refused, not counted.
    await acted(await approve(id, view.hash, $("#vote-text").value), () => { $("#vote-text").value = ""; });
  });
  $("#reject").addEventListener("click", async () => {
    await acted(await reject(id, $("#vote-text").value), () => { $("#vote-text").value = ""; });
  });
  $("#withdraw-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    await acted(await withdraw(id));
  });
</script>
</body>
</html>
