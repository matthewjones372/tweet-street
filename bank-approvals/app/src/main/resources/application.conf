approvals {
  # Spans to Tempo (lark-bank spec 0024): a request from the bank continues its trace here.
  telemetry {
    enabled = false
    enabled = ${?TELEMETRY_ENABLED}
    otlp = "http://127.0.0.1:4318"
    otlp = ${?OTEL_EXPORTER_OTLP_ENDPOINT}
    sampled = 0.1
    sampled = ${?TELEMETRY_SAMPLED}
  }

  host = "127.0.0.1"
  host = ${?HOST}
  port = 8070
  port = ${?PORT}

  # Joined by lark-app-cluster, as the bank's nodes are.
  cluster {
    node {
      name = "approvals-1"
      name = ${?POD_NAME}
      host = "127.0.0.1"
      host = ${?POD_IP}
      port = 25530
      port = ${?REMOTING_PORT}
    }
    join = "static"
    join = ${?CLUSTER_JOIN}
    static.seeds = ["127.0.0.1:25530"]
    kubernetes {
      selector { app = "bank-approvals" }
      lease = "bank-approvals-split-brain"
    }
    downing.stableAfter = 20s
    gossip { probeEvery = 1s, ackWithin = 600ms, formAfter = 5s }
    whenDowned = exit
  }

  entities {
    shards = 64
    passivateAfter = 10m
    askTimeout = 3s
    # How often an approved request asks its owning service to apply it, until it hears that it did.
    applyEvery = 30s
  }

  database {
    url = "jdbc:postgresql://127.0.0.1:5432/approvals"
    url = ${?DATABASE_URL}
    user = "approvals"
    user = ${?DATABASE_USER}
    password = "approvals"
    password = ${?DATABASE_PASSWORD}
    poolSize = 16
    poolSize = ${?DATABASE_POOL_SIZE}
  }

  # Who approves what, and when nobody need look: shipped by Flux beside the service, read again when it changes.
  policies = "policies/policies.yaml"
  policies = ${?POLICIES}

  # Every request's event published to bank.approval-events (lark-bank spec 0019), as the bank publishes its own.
  kafka {
    bootstrap = "127.0.0.1:9092"
    bootstrap = ${?KAFKA_BOOTSTRAP}
    registry = "http://127.0.0.1:8081/apis/registry/v3"
    registry = ${?APICURIO_URL}
    # Copies of each partition: 3 on a cluster of brokers, 1 on the one broker at home.
    replication = 1
    replication = ${?KAFKA_REPLICATION}
    # Approvals' user on the brokers (lark-bank spec 0021): empty connects as nobody, which a broker with users refuses.
    username = ""
    username = ${?KAFKA_USERNAME}
    password = ""
    password = ${?KAFKA_PASSWORD}
    # Publishers following the journal, spread over the nodes, each a share of the requests; and how often each looks.
    publishers = 4
    every = 1s
  }

  # Every day before today is digested once: each request's chain head that day, hashed into one digest.
  audit {
    digestEvery = 1h
  }

  identity {
    issuer = "http://127.0.0.1:9000"
    issuer = ${?IDENTITY_ISSUER}
    audience = "bank-approvals"
    audience = ${?IDENTITY_AUDIENCE}
    # The pages sign in as the provider's client; the session is sealed with a key every node shares (base64, 32 bytes).
    clientId = "approvals-pages"
    clientId = ${?IDENTITY_CLIENT_ID}
    clientSecret = ""
    clientSecret = ${?IDENTITY_CLIENT_SECRET}
    callbackUrl = "http://127.0.0.1:8070/callback"
    callbackUrl = ${?IDENTITY_CALLBACK_URL}
    sessionKey = ""
    sessionKey = ${?IDENTITY_SESSION_KEY}
    # Owning services' clients, comma-separated: a client-credentials token from Pocket ID names the client as its
    # audience and carries no groups, so a token for one of these is that service, in `services`.
    services = ""
    services = ${?IDENTITY_SERVICES}
  }
}
